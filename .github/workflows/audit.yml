name: audit

# Checks the lockfiles for known vulnerable and malicious packages. Reads only the lockfiles, so nothing is installed.
# Runs daily as well, because new advisories appear without a code change.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 09:00 Malaysia time.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: npm audit (production, high and above)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
