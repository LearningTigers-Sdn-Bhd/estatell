name: audit

# Checks the lockfiles for known vulnerable and malicious packages. Reads only the lockfiles, so nothing is installed.
# Runs daily as well, because new advisories appear without a code change.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 09:00 Malaysia time.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Composer audit
        run: composer audit --locked --no-interaction

      # Fails on any high or critical advisory except those in IGNORED_ADVISORIES. Keep that list short, with a reason
      # and the condition to remove each one.
      # - GHSA-fc5q-39xc-vjpf (picomatch ReDoS, every version up to 4.0.7): no fixed version yet. picomatch runs only
      #   at build time on our own file patterns, never on guest input. Remove once picomatch ships a fix.
      - name: npm audit (production, high and above)
        if: ${{ !cancelled() }}
        env:
          IGNORED_ADVISORIES: GHSA-fc5q-39xc-vjpf
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          jq -r --arg ignored "$IGNORED_ADVISORIES" '
            ($ignored | split(" ")) as $skip
            | [.vulnerabilities[].via[] | objects
               | select(.severity == "high" or .severity == "critical")
               | select((.url | split("/") | last) as $id | $skip | index($id) | not)
               | "\(.severity) \(.name): \(.title) \(.url)"]
            | unique | .[]' npm-audit.json > npm-audit-failures.txt
          if [ -s npm-audit-failures.txt ]; then
            cat npm-audit-failures.txt
            exit 1
          fi
          echo "No high or critical npm advisories (ignored: $IGNORED_ADVISORIES)."
