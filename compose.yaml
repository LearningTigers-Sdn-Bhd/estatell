x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
        args:
            VITE_APP_NAME: ${APP_NAME:-estatell}
    image: estatell-app:latest
    restart: unless-stopped
    environment: &app-env
        APP_NAME: ${APP_NAME:-estatell}
        APP_ENV: ${APP_ENV:-production}
        APP_DEBUG: ${APP_DEBUG:-false}
        APP_KEY: ${APP_KEY}
        APP_URL: ${APP_URL}
        TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
        DB_CONNECTION: ${DB_CONNECTION:-pgsql}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT:-5432}
        DB_DATABASE: ${DB_DATABASE:-estatell}
        DB_USERNAME: ${DB_USERNAME:-estatell}
        DB_PASSWORD: ${DB_PASSWORD}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
        QUEUE_CONNECTION: redis
        CACHE_STORE: redis
        SESSION_DRIVER: redis
        CIPHERSWEET_KEY: ${CIPHERSWEET_KEY}
        R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
        R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
        R2_BUCKET: ${R2_BUCKET:-}
        R2_ENDPOINT: ${R2_ENDPOINT:-}
        # Images that guests see. See docs/deployment/production_environment.md.
        MEDIA_PUBLIC_DISK: ${MEDIA_PUBLIC_DISK:-public}
        R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-}
        R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
        # Partner Demo access card. See docs/deployment/production_environment.md.
        DEMO_URL: ${DEMO_URL:-}
        DEMO_PASSWORD: ${DEMO_PASSWORD:-}
        BORENO_SEED_PASSWORD: ${BORENO_SEED_PASSWORD:-}
        MAIL_MAILER: ${MAIL_MAILER:-log}
        MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
        MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Estatell Notifications}
        MILLIONSEND_BASE_URL: ${MILLIONSEND_BASE_URL:-}
        MILLIONSEND_API_KEY: ${MILLIONSEND_API_KEY:-}
        MILLIONSEND_WEBHOOK_SECRET: ${MILLIONSEND_WEBHOOK_SECRET:-}
        # Booking engine payments: Curlec live keys only. See docs/29-booking-engine/04-payment.md#environments.
        CURLEC_BASE_URL: ${CURLEC_BASE_URL:-https://api.razorpay.com/v1}
        CURLEC_ACCOUNT: ${CURLEC_ACCOUNT:-primary}
        CURLEC_KEY_ID: ${CURLEC_KEY_ID:-}
        CURLEC_KEY_SECRET: ${CURLEC_KEY_SECRET:-}
        CURLEC_WEBHOOK_SECRET: ${CURLEC_WEBHOOK_SECRET:-}
        BOOKING_SITE_URL: ${BOOKING_SITE_URL:-https://booking.estatell.com}
        BOOKING_API_DOCS_URL: ${BOOKING_API_DOCS_URL:-https://docs.estatell.com/en/docs/developers/booking-api}
        AUTORUN_ENABLED: 'false'
    volumes:
        # Media stored on "This server" (ID scans, signatures, photos). Shared by all services.
        - media:/var/www/html/storage/app/private

services:
    web:
        <<: *app
        environment:
            <<: *app-env
            AUTORUN_ENABLED: 'true'
            INERTIA_SSR_URL: ${INERTIA_SSR_URL:-http://ssr:13714}

    horizon:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'horizon']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-horizon']
            start_period: 10s

    scheduler:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s

    # Renders the public pages (home, services, legal) to HTML, so crawlers and AI answer engines see the content.
    # It needs no secrets, database or volume. If it is down, pages still work: Laravel falls back to browser rendering.
    ssr:
        image: estatell-app:latest
        restart: unless-stopped
        depends_on:
            - web
        command: ['node', '/var/www/html/bootstrap/ssr/app.js']
        environment:
            AUTORUN_ENABLED: 'false'
        stop_signal: SIGTERM
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:13714/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 30s
            timeout: 5s
            start_period: 10s

volumes:
    media:
