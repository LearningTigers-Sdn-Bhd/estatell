x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
        args:
            VITE_APP_NAME: ${APP_NAME:-estatell}
    image: estatell-app:latest
    restart: unless-stopped
    environment: &app-env
        APP_NAME: ${APP_NAME:-estatell}
        APP_ENV: ${APP_ENV:-production}
        APP_DEBUG: ${APP_DEBUG:-false}
        APP_KEY: ${APP_KEY}
        APP_URL: ${APP_URL}
        TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
        DB_CONNECTION: ${DB_CONNECTION:-pgsql}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT:-5432}
        DB_DATABASE: ${DB_DATABASE:-estatell}
        DB_USERNAME: ${DB_USERNAME:-estatell}
        DB_PASSWORD: ${DB_PASSWORD}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
        QUEUE_CONNECTION: redis
        CACHE_STORE: redis
        SESSION_DRIVER: redis
        CIPHERSWEET_KEY: ${CIPHERSWEET_KEY}
        R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
        R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
        R2_BUCKET: ${R2_BUCKET:-}
        R2_ENDPOINT: ${R2_ENDPOINT:-}
        # Partner Demo access card. See docs/deployment/production_environment.md.
        DEMO_URL: ${DEMO_URL:-}
        DEMO_PASSWORD: ${DEMO_PASSWORD:-}
        BORENO_SEED_PASSWORD: ${BORENO_SEED_PASSWORD:-}
        AUTORUN_ENABLED: 'false'
    volumes:
        # Media stored on "This server" (ID scans, signatures, photos). Shared by all services.
        - media:/var/www/html/storage/app/private

services:
    web:
        <<: *app
        environment:
            <<: *app-env
            AUTORUN_ENABLED: 'true'

    horizon:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'horizon']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-horizon']
            start_period: 10s

    scheduler:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s

volumes:
    media:
